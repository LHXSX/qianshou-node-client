name: build-tauri-multi-platform

# 触发条件:
#   1. 手动 (UI 上点 Run workflow) · 含 publish 选项
#   2. push tag v* · 自动 build 并发到 Releases
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发到 GitHub Releases (true/false)'
        required: false
        default: 'true'
  push:
    tags:
      - 'v*'

jobs:
  # 0 · 每次 CI 跑之前清掉同名 stale draft release · 避免 tauri-action 上传时
  #     "ReleaseAsset already_exists" (重跑 / 重新打 tag 场景常见)
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: delete stale release (if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag push · 清旧 release ${{ github.ref_name }}"
            gh release delete "${{ github.ref_name }}" --yes --cleanup-tag=false -R ${{ github.repository }} 2>&1 || echo "(无旧 release · 继续)"
          else
            echo "非 tag push · 跳过"
          fi

  build-tauri:
    needs: prepare-release
    permissions:
      contents: write   # 允许 release 写入
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            label: 'macos-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            label: 'macos-intel'
          - platform: 'windows-latest'
            # --bundles nsis · 跳 MSI (WIX light.exe 不支持中文路径 "千手节点_x.x.x_x64_en-US.msi" 会挂)
            # NSIS .exe 已包含全部安装/卸载功能 · 企业 IT 部署也支持静默 /S
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
            label: 'windows-x64'
          # Linux 暂关 · 想开打开即可
          # - platform: 'ubuntu-22.04'
          #   args: ''
          #   label: 'linux-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      # 1 · 拉代码
      - uses: actions/checkout@v4

      # 2 · 装 Node 20 (前端 build 用)
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3 · 装 Rust 稳定版 + 目标平台 toolchain
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # mac 上额外加 intel 目标 · 其他平台用默认
          targets: ${{ matrix.label == 'macos-intel' && 'x86_64-apple-darwin' || (matrix.label == 'macos-arm64' && 'aarch64-apple-darwin' || '') }}

      # 4 · Rust 缓存 (大幅加速 · 第二次 build 节省 60%+ 时间)
      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 5 · Linux 才需要装 system deps (本 workflow 默认不开 linux)
      - name: install linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 6 · 装 npm 依赖
      - name: install frontend deps
        run: npm ci

      # 6.5 · prebake runtime (2026-05-28 加 · 修跨平台装失败 P0 bug)
      #
      # 历史: 早期把 mac-arm64 cpython (326MB) commit 进 git
      #       → Intel mac / Windows build 出来后 bundle 进的是 mac-arm64 二进制
      #       → 装上就跑不动 (架构不对) · 90% 装失败原因
      #
      # 新法: 每平台 runner 跑 prebake-runtime.sh 自下平台对应 cpython+uv
      #       脚本写 src-tauri/resources/runtime/{cpython,manifest.json} + bin/uv-*
      #       接着 tauri-action build · bundle resources/* 进 .app/.exe
      #       客户端启动 bootstrap_bundled 拷到 ~/.qianshou/runtime/ (跟旧行为一致)
      - name: prebake runtime (cpython + uv)
        shell: bash
        run: |
          bash scripts/prebake-runtime.sh ${{ matrix.label }}
          echo ""
          echo "=== resources 目录确认 ==="
          ls -la src-tauri/resources/runtime/cpython/ || true
          ls -la src-tauri/resources/bin/ || true
          cat src-tauri/resources/runtime/manifest.json

      # 6.6 · prebake OCR (仅 Windows · 8.1.6 内置 tesseract+tessdata · 解决 OCR 依赖缺陷)
      #
      # choco 装 tesseract(含 exe+DLL+eng tessdata)→ 复制进 resources/ocr/,chi_sim 公共源补;
      # 客户端 bootstrap ensure_bundled_ocr 据 manifest 注册 ocr tier,executor 注入
      # TESSDATA_PREFIX/PATH → pytesseract 开箱即用。非 Windows 不跑(走镜像 tier / 系统 tesseract)。
      - name: prebake OCR (windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          choco install tesseract --no-progress -y
          TESS_DIR="/c/Program Files/Tesseract-OCR"
          if [ ! -f "$TESS_DIR/tesseract.exe" ]; then
            FOUND="$(find /c -iname tesseract.exe 2>/dev/null | head -1)"
            [ -n "$FOUND" ] && TESS_DIR="$(dirname "$FOUND")"
          fi
          echo "tesseract install dir: $TESS_DIR"
          TESS_LOCAL_DIR="$TESS_DIR" bash scripts/prebake-ocr-windows.sh
          echo "=== resources/ocr 确认 ==="
          ls -la src-tauri/resources/ocr/ || true
          ls -la src-tauri/resources/ocr/tessdata/ || true

      # 6.7 · prebake OCR (仅 mac arm64 · 8.1.6 内置可重定位 tesseract · 解决 OCR 依赖缺陷)
      #
      # runner 为 arm64 → 只给 macos-arm64 包内置(装的是 arm64 tesseract);macos-intel
      # 塞 arm64 二进制会跑不动 → 不内置,静默回退系统/镜像 tesseract(零回归)。
      # 脚本自带 --version 自检:重定位失败则删 manifest → 客户端静默回退,绝不出坏包。
      - name: prebake OCR (macos-arm64 only)
        if: matrix.label == 'macos-arm64'
        shell: bash
        run: |
          bash scripts/prebake-ocr-macos.sh || echo "(mac OCR prebake 跳过/失败 · 回退系统 tesseract · 不阻断构建)"
          echo "=== resources/ocr 确认 ==="
          ls -la src-tauri/resources/ocr/ || true
          ls -la src-tauri/resources/ocr/tessdata/ 2>/dev/null || true

      # 7 · Tauri 一键 build + 自动签名 + (可选) 上传到 Releases
      - name: build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          # 必填 · 签名私钥 (从仓库 secrets 注入)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # GitHub Release token (auto)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag 必须存在 (要么手动 push tag · 要么 workflow_dispatch 自动建 draft)
          tagName: ${{ github.ref_name }}
          releaseName: 'Qianshou Node ${{ github.ref_name }}'
          releaseBody: |
            ## 千手节点 ${{ github.ref_name }}
            
            自动 build 由 GitHub Actions 完成 · 含 macOS arm64 + macOS Intel + Windows x64
            
            - macOS: 下载 `.dmg` 直接装
            - Windows: 下载 `.exe` 直接装 · OTA 用 `.nsis.zip`
            
            签名验证: 公钥 `.tauri-keys-2026/qianshou-2026.key.pub`
          releaseDraft: ${{ github.event.inputs.publish_release != 'false' }}
          prerelease: false
          args: ${{ matrix.args }}
          # tauri 2.x 不再产 legacy latest.json · 我们自己维护 release.json/binary.json
          # 关掉避免 "Signature not found for the updater JSON" 导致 exit 1
          includeUpdaterJson: false

      # 8 · 额外上传 artifact 一份 (UI 上方便下载 · 即使没发 release)
      - name: upload artifacts (debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-build-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.exe.sig
            src-tauri/target/**/release/bundle/nsis/*.nsis.zip
            src-tauri/target/**/release/bundle/nsis/*.nsis.zip.sig
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════ 发布 OTA 热更新 + 下载中心(仅 tag v*)═══════════════════
  # 本机 SSH 被本地 VPN 阻断(banner 超时),改由 runner(可达服务器)发布。
  # 仅在三平台 build 全绿后跑;分发产物 + 改 binary.json(OTA 清单)+ release.json(下载页)。
  # 逻辑对齐已验证的 scripts/publish-from-release.sh(8.1.0–8.1.5),改前自动 .bak 备份。
  publish-ota:
    name: Publish OTA + Download Center
    needs: build-tauri
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci_publish_ota.py
          sparse-checkout-cone-mode: false

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version $VER"; exit 1; }
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Stage release files
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          mkdir -p _stage
          # 安装器/exe 已带版本+arch · 直接拷(dmg×2 + win exe + sig)
          find _artifacts -type f \( -name '*.dmg' -o -name '*x64-setup.exe' \
            -o -name '*x64-setup.exe.sig' \) -exec cp -f {} _stage/ \;
          # macOS updater bundle 名固定为「千手节点.app.tar.gz」(无 arch)· arm/intel 会互相覆盖,
          # 故按 label artifact 目录分别重命名成带 arch 的名字(对齐 binary.json/release.json 约定)。
          stage_appgz() {  # $1=label  $2=arch 后缀
            local d f
            d="$(find _artifacts -maxdepth 1 -type d -name "tauri-build-$1" | head -1)"
            [ -z "$d" ] && { echo "  (无 $1 artifact)"; return 0; }
            f="$(find "$d" -name '千手节点.app.tar.gz' | head -1)"
            [ -z "$f" ] && { echo "  ($1 无 app.tar.gz)"; return 0; }
            cp -f "$f" "_stage/千手节点_${VER}_$2.app.tar.gz"
            [ -f "$f.sig" ] && cp -f "$f.sig" "_stage/千手节点_${VER}_$2.app.tar.gz.sig"
          }
          stage_appgz macos-arm64 aarch64
          stage_appgz macos-intel x64
          echo "=== staged ==="; ls -la _stage/
          ls _stage/*x64-setup.exe >/dev/null 2>&1 || { echo "✗ 缺 Windows .exe · 中止发布"; exit 1; }
          ls _stage/*aarch64.app.tar.gz >/dev/null 2>&1 || { echo "✗ 缺 mac arm OTA payload · 中止发布"; exit 1; }

      - name: Setup SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/ci_deploy
          chmod 600 ~/.ssh/ci_deploy
          ssh-keyscan -t ed25519,rsa 47.86.60.178 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy OTA + release.json
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          NOTES="${VER} · 节点企业级可观测+自愈:① 失败诊断三件套(stderr_tail/exit_code/python_used 回传后端·Win 出错不再只看到光秃秃的 exit 码)② 失败分类(env/script/resource/network/timeout·缺包名提取)③ 能力真探针(用各 tier venv 真 import 验证·杜绝低配机吹自己有 torch 被错派)④ 节点自愈(环境类失败→后台重装对应 tier→刷新能力→下次心跳重报真实能力·带每日限流+连续失败放弃防失控)"
          NOTES_B64="$(printf '%s' "$NOTES" | base64 | tr -d '\n')"
          H=root@47.86.60.178; K=~/.ssh/ci_deploy
          tar -czf _stage.tar.gz -C _stage .
          scp -i "$K" _stage.tar.gz scripts/ci_publish_ota.py "$H:/tmp/"
          ssh -i "$K" "$H" "set -e; \
            rm -rf /tmp/qs_stage_${VER} && mkdir -p /tmp/qs_stage_${VER} && \
            tar -xzf /tmp/_stage.tar.gz -C /tmp/qs_stage_${VER} && \
            VERSION='${VER}' NOTES_B64='${NOTES_B64}' SRC_DIR=/tmp/qs_stage_${VER} \
              python3 /tmp/ci_publish_ota.py && \
            rm -rf /tmp/qs_stage_${VER} /tmp/_stage.tar.gz /tmp/ci_publish_ota.py"

      - name: Verify OTA endpoints + download page
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          for a in "darwin/aarch64" "darwin/x86_64" "windows/x86_64"; do
            got=$(curl -sf "https://www.wujisuanli.com/api/v8/client/updater/${a}/8.0.0" \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('version','?'))" 2>/dev/null || echo "?")
            printf "  %-18s OTA version=%s\n" "$a" "$got"
            [ "$got" = "$VER" ] || echo "    ⚠ 未返回 $VER(可能后端缓存,稍后自检)"
          done
          rv=$(curl -sf "https://pidbai.com/downloads/latest/release.json" \
            | python3 -c "import json,sys;print(json.load(sys.stdin).get('version','?'))" 2>/dev/null || echo "?")
          echo "  download page release.json version=$rv"
